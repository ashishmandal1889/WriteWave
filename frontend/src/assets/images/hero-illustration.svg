<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <!-- Subtle background glow / platform -->
  <ellipse cx="300" cy="420" rx="240" ry="40" fill="#E2E8F0" opacity="0.6"/>
  <ellipse cx="300" cy="420" rx="180" ry="26" fill="#DBEAFE" opacity="0.8"/>

  <!-- Floating background cards / pages -->
  <g filter="drop-shadow(0 10px 25px rgba(23, 32, 51, 0.08))">
    <!-- Back card tilted right -->
    <rect x="330" y="90" width="180" height="230" rx="16" fill="#FFFFFF" transform="rotate(12 330 90)" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="360" y1="130" x2="470" y2="154" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" transform="rotate(12 330 90)"/>
    <line x1="360" y1="155" x2="450" y2="175" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" transform="rotate(12 330 90)"/>
    <line x1="360" y1="180" x2="460" y2="202" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" transform="rotate(12 330 90)"/>

    <!-- Back card tilted left -->
    <rect x="90" y="110" width="180" height="240" rx="16" fill="#FFFFFF" transform="rotate(-8 90 110)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="110" y="130" width="40" height="40" rx="8" fill="#EFF6FF" transform="rotate(-8 90 110)"/>
    <path d="M125 150L135 140" stroke="#2563EB" stroke-width="3" stroke-linecap="round" transform="rotate(-8 90 110)"/>
    <line x1="165" y1="140" x2="245" y2="129" stroke="#172033" stroke-width="4" stroke-linecap="round" transform="rotate(-8 90 110)"/>
    <line x1="165" y1="160" x2="225" y2="151" stroke="#64748B" stroke-width="3" stroke-linecap="round" transform="rotate(-8 90 110)"/>
    <line x1="110" y1="195" x2="240" y2="177" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" transform="rotate(-8 90 110)"/>
    <line x1="110" y1="215" x2="230" y2="198" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" transform="rotate(-8 90 110)"/>
    <line x1="110" y1="235" x2="210" y2="219" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" transform="rotate(-8 90 110)"/>
  </g>

  <!-- Central Main Tablet / Writing Slate -->
  <g filter="drop-shadow(0 20px 35px rgba(23, 32, 51, 0.12))">
    <rect x="150" y="130" width="300" height="260" rx="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- Top Slate Bar -->
    <rect x="150" y="130" width="300" height="44" rx="20" fill="#F8FAFC"/>
    <circle cx="178" cy="152" r="5" fill="#EF4444" opacity="0.6"/>
    <circle cx="196" cy="152" r="5" fill="#F59E0B" opacity="0.6"/>
    <circle cx="214" cy="152" r="5" fill="#10B981" opacity="0.6"/>
    <rect x="250" y="146" width="160" height="12" rx="6" fill="#E2E8F0"/>

    <!-- Editor content lines -->
    <rect x="180" y="195" width="140" height="14" rx="4" fill="#2563EB"/>
    <rect x="180" y="225" width="240" height="8" rx="4" fill="#64748B" opacity="0.8"/>
    <rect x="180" y="245" width="220" height="8" rx="4" fill="#64748B" opacity="0.6"/>
    <rect x="180" y="265" width="190" height="8" rx="4" fill="#64748B" opacity="0.6"/>
    <rect x="180" y="285" width="230" height="8" rx="4" fill="#64748B" opacity="0.4"/>

    <!-- Animated / dynamic wave stroke across page -->
    <path d="M 175 340 C 220 310, 260 370, 310 335 C 340 315, 370 330, 420 320" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 190 355 C 235 330, 275 380, 325 350 C 355 332, 385 345, 410 338" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Modern Digital Stylus / Fountain Pen writing on the slate -->
  <g transform="translate(380, 160) rotate(-35)" filter="drop-shadow(5px 12px 18px rgba(23, 32, 51, 0.15))">
    <!-- Pen body -->
    <rect x="0" y="0" width="22" height="160" rx="10" fill="#172033"/>
    <!-- Pen accent stripe -->
    <rect x="0" y="40" width="22" height="12" fill="#2563EB"/>
    <!-- Pen clip -->
    <rect x="20" y="15" width="4" height="60" rx="2" fill="#64748B"/>
    <!-- Pen nib holder -->
    <path d="M0 160 L11 190 L22 160 Z" fill="#2563EB"/>
    <!-- Pen nib tip -->
    <path d="M7 180 L11 205 L15 180 Z" fill="#FFFFFF"/>
    <circle cx="11" cy="188" r="1.5" fill="#2563EB"/>
  </g>

  <!-- Creative Inspiration Sparkles / Floating Badges -->
  <!-- Idea Badge Left -->
  <g transform="translate(90, 280)" filter="drop-shadow(0 8px 16px rgba(37, 99, 235, 0.15))">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#2563EB"/>
    <!-- Quill / Wave inside badge -->
    <path d="M20 42C23 42 26 38 30 33C34 28 36 21 41 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="41" cy="18" r="2" fill="#FFFFFF"/>
    <path d="M18 36C22 36 24 33 28 29" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Thought Sparkles Right -->
  <g transform="translate(480, 170)">
    <path d="M20 0 L23 14 L37 17 L23 20 L20 34 L17 20 L3 17 L17 14 Z" fill="#2563EB"/>
  </g>
  <g transform="translate(440, 100) scale(0.6)">
    <path d="M20 0 L23 14 L37 17 L23 20 L20 34 L17 20 L3 17 L17 14 Z" fill="#64748B"/>
  </g>
  <g transform="translate(130, 80) scale(0.7)">
    <path d="M20 0 L23 14 L37 17 L23 20 L20 34 L17 20 L3 17 L17 14 Z" fill="#2563EB"/>
  </g>

  <!-- Floating tag: 'Publish & Inspire' -->
  <g transform="translate(360, 370)" filter="drop-shadow(0 6px 14px rgba(23, 32, 51, 0.08))">
    <rect x="0" y="0" width="150" height="42" rx="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="21" cy="21" r="8" fill="#EFF6FF"/>
    <circle cx="21" cy="21" r="4" fill="#2563EB"/>
    <text x="38" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#172033" letter-spacing="0.3">Share Ideas</text>
  </g>
</svg>
