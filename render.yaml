# ==============================================================================
# WriteWave Render Blueprint (render.yaml)
# Single-platform deployment for Backend (Web Service) and Frontend (Static Site)
# ==============================================================================

services:
  - type: web
    name: writewave-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

staticSites:
  - name: writewave-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
