# ==============================================================================
# WriteWave Render Blueprint (render.yaml)
# Single-platform deployment for Frontend (Static Site) and Backend (Web Service)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend: Node.js Express REST API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: writewave-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure secret
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard: URL of your deployed frontend (e.g. https://writewave-frontend.onrender.com)
      - key: JWT_EXPIRES_IN
        value: 7d

  # ----------------------------------------------------------------------------
  # Frontend: React + Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: writewave-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing: Rewrite all path requests to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render Dashboard: URL of your deployed backend (e.g. https://writewave-backend.onrender.com/api/v1)
